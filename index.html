  function toMyanmarDigits(n){ const map = {"0":"၀","1":"၁","2":"၂","3":"၃","4":"၄","5":"၅","6":"၆","7":"၇","8":"၈","9":"၉"}; return String(n).split("").map(c => map[c] !== undefined ? map[c] : c).join(""); }
  function citationText(bookMeta, pageNum){ const shortName = bookMeta.short_name || bookMeta.name || ""; const mmPage = toMyanmarDigits(pageNum); return `(${shortName}${mmPage}။)`; }

  // မြန်မာဂဏန်းကို အင်္ဂလိပ်ဂဏန်းအဖြစ် ပြန်ပြောင်းရန်
  function fromMyanmarDigits(str){ const map = {"၀":"0","၁":"1","၂":"2","၃":"3","၄":"4","၅":"5","၆":"6","၇":"7","၈":"8","၉":"9"}; return String(str).split("").map(c => map[c] !== undefined ? map[c] : c).join(""); }

  // ref_keys နှင့်တိုက်ဆိုင်ရန် ဗလာနေရာ/ပုဒ်ဖြတ်သင်္ကေတများကို ရှင်းထုတ်ခြင်း
  function normalizeRefKey(s){ return String(s || "").replace(/[\s၊။.,]/g, ""); }

  // ==========================================================================================
  // ကျမ်းညွန်းစာကြောင်းတစ်ခုတည်းထဲမှာ -
  //  - စာအုပ်တစ်အုပ်တည်းမှ စာပိုဒ်များစွာ (ဥပမာ "ပါရာ။ ၃၉, ၄၂, ...")
  //  - စာအုပ်များစွာ ရောပြီးဖော်ပြထားခြင်း (ဥပမာ "မ။ နိ။ ၂။၁၈၄၊ သံ။ နိ။ ၂။၂၂, ၂၃၇")
  //  - တစ်အုပ်တည်းထဲမှာ volume အမျိုးမျိုးပြောင်းခြင်း (ဥပမာ "အ။ နိ။ ၂။၅၊ ၈။၁၃")
  //  - "စာပိုဒ်-N မှ N" range (ဥပမာ "၆၅-၆၇")
  //  - စာပိုဒ်နံပါတ်အစား ခေါင်းစဉ်/သုတ်/ဝတ္ထုအမည် ပါခြင်း (ဥပမာ "သု။ နိ။ အာဠဝကသုတ္တ") - toc.json ဖြင့်ရှာရန်
  //  - ကျမ်းညွန်းရှေ့မှာ ရှင်းလင်းချက်စကားစု ပါခြင်း (ဥပမာ "နိဗ္ဗတ္တိတတ္တာ မ။ နိ။ ဋီ။ ၁။၁")
  //  - နိပါတ်/ဂဏန်းများစွာ ဆက်တိုက်ပါပြီး အနောက်ဆုံးနံပါတ်သာ စာပိုဒ်ဖြစ်ခြင်း (ဥပမာ "အပ။ ၁။၁။၄၈")
  // စတာတွေအားလုံးကို ခွဲခြမ်းစိတ်ဖြာပြီး link span list တစ်ခုအဖြစ် ပြန်ပေးသည်။
  //
  // ချဉ်းကပ်ပုံ - block တစ်ခုစီအတွက် (booksep-comma ဖြင့်ခွဲထားပြီးသား) "" (period) ခွဲထားသော token
  // များကို ရှေ့ဆုံးမှစပြီး တစ်ခုချင်း စုပေါင်းကာ books.json ရဲ့ ref_keys နှင့် အကောင်းဆုံး (အရှည်ဆုံး)
  // တိုက်ဆိုင်သည့်နေရာအထိ ရှာသည် (greedy longest match)။ ရှေ့ဆုံး token မှာ စတင်ရှာ၍ မတွေ့လျှင် နောက်
  // token တစ်ခုချင်းစီမှ ပြန်စရှာသည် (ရှေ့က ရှင်းလင်းချက်စကားစုများကို ကျော်ရန်)။ ကျန်အပိုင်းက စာပိုဒ်
  // နံပါတ် (သို့) ခေါင်းစဉ် ဖြစ်သည်။
  // ==========================================================================================

  function tp_normKeyOf(idx, key){
    return idx.books.find(b => Array.isArray(b.ref_keys) && b.ref_keys.some(k => normalizeRefKey(k) === key)) || null;
  }

  // "" period / "" comma / ASCII "," / space တို့ဖြင့် token များအဖြစ် ခွဲခြင်း (hyphen ကိုတော့ token ထဲမှာ ထားမည်)
  function tp_tokenize(text){
    const tokens = [];
    const re = /[^\s,\u104A\u104B]+/g;
    let m;
    while((m = re.exec(text)) !== null) tokens.push({text: m[0], start: m.index, end: m.index + m[0].length});
    return tokens;
  }

  function tp_greedyMatch(idx, tokens, startIdx){
    let acc = "", bestUpTo = -1, bestBook = null;
    for(let i = startIdx; i < tokens.length; i++){
      acc += tokens[i].text;
      const book = tp_normKeyOf(idx, normalizeRefKey(acc));
      if(book){ bestUpTo = i; bestBook = book; }
    }
    return bestUpTo === -1 ? null : { startIdx, upTo: bestUpTo, book: bestBook };
  }

  // ရှေ့မှာ ရှင်းလင်းချက်စကားစုပါနိုင်တာမို့ token တစ်ခုချင်းစီမှ စတင်ကာ ref_keys တိုက်ဆိုင်မှု ရှာသည်
  function tp_findBlockPrefix(idx, tokens){
    for(let s = 0; s < tokens.length; s++){ const r = tp_greedyMatch(idx, tokens, s); if(r) return r; }
    return null;
  }

  // ကျန်အပိုင်း (prefix ပြီးနောက်ပိုင်း) ကို "" volGroup + "," item များအဖြစ် ခွဲပြီး စာပိုဒ်/ခေါင်းစဉ် spans ထုတ်သည်
  function tp_processRemainder(idx, remainderText, remainderAbsOffset, bestBook, baseLetterPrefixNorm, hasVolumeToken){
    const spans = [];
    const groupRanges = [];
    let cursor = 0;
    {
      const re = /\u104A/g; let m;
      while((m = re.exec(remainderText)) !== null){
        let after = m.index + 1;
        while(after < remainderText.length && /\s/.test(remainderText[after])) after++;
        if(remainderText[after] && /[\u1040-\u1049]/.test(remainderText[after])){
          groupRanges.push({start: cursor, end: m.index}); cursor = m.index + 1;
        }
      }
      groupRanges.push({start: cursor, end: remainderText.length});
    }

    groupRanges.forEach((gr, gi) => {
      const group = remainderText.slice(gr.start, gr.end);
      const groupAbsStart = remainderAbsOffset + gr.start;
      let groupBook = bestBook;
      // ပထမဆုံး group မှလွဲ၍ ကျန်တာတွေက volume အသစ်ဖြစ်နိုင်တာမို့ prefix+volume ဖြင့် ပြန်ရှာကြည့်မည်
      if(gi > 0 && hasVolumeToken){
        const fd = group.match(/[\u1040-\u1049]+/);
        if(fd){
          const altBook = tp_normKeyOf(idx, baseLetterPrefixNorm + normalizeRefKey(fd[0]));
          if(altBook) groupBook = altBook;
        }
      }

      let tCursor = 0;
      group.split(",").forEach(itemRaw => {
        const itemAbsStart = groupAbsStart + tCursor;
        tCursor += itemRaw.length + 1;

        const rangeMatch = itemRaw.match(/([\u1040-\u1049]+)\s*-\s*([\u1040-\u1049]+)/);
        if(rangeMatch){
          const n1 = rangeMatch[1], n2 = rangeMatch[2];
          const n1Start = itemAbsStart + itemRaw.indexOf(n1);
          const n2Start = itemAbsStart + itemRaw.lastIndexOf(n2);
          spans.push({start:n1Start, end:n1Start+n1.length, bookId:groupBook.id, paraNum:parseInt(fromMyanmarDigits(n1),10)});
          spans.push({start:n2Start, end:n2Start+n2.length, bookId:groupBook.id, paraNum:parseInt(fromMyanmarDigits(n2),10)});
          return;
        }

        const digitMatches = [...itemRaw.matchAll(/[\u1040-\u1049]+/g)];
        if(digitMatches.length > 0){
          // ဂဏန်းများစွာဆက်တိုက်ပါလျှင် (ဥပမာ "၅၅။၂၄၄") "အနောက်ဆုံး" ဂဏန်းသည် စာပိုဒ်ဖြစ်သည်
          const last = digitMatches[digitMatches.length-1];
          const nStart = itemAbsStart + last.index;
          spans.push({start:nStart, end:nStart+last[0].length, bookId:groupBook.id, paraNum:parseInt(fromMyanmarDigits(last[0]),10)});
        } else {
          // ဂဏန်းလုံးဝမပါ - toc.json ဖြင့်ရှာရမည့် ခေါင်းစဉ်/သုတ်/ဝတ္ထုအမည်
          const titleText = itemRaw.replace(/^[\s\u104B]+/, "").replace(/[\s\u104B]+$/, "");
          if(titleText){
            const idxInItem = itemRaw.indexOf(titleText);
            spans.push({start: itemAbsStart + idxInItem, end: itemAbsStart + idxInItem + titleText.length, bookId: groupBook.id, title: titleText});
          }
        }
      });
    });

    return spans;
  }

  function parseCitationSpans(idx, inner){
    const spans = []; // { start, end, bookId, paraNum } (သို့) { start, end, bookId, title } - offset သည် inner string အတွင်း absolute
    if(!idx || !Array.isArray(idx.books)) return spans;

    // ၁) "" ပြီးနောက် မြန်မာစာလုံးလာလျှင် "စာအုပ်အသစ်" ဟု သတ်မှတ်ပြီး block များအဖြစ်ခွဲမည်
    const blockRanges = [];
    let cursor = 0;
    {
      const re = /\u104A/g; let m;
      while((m = re.exec(inner)) !== null){
        let after = m.index + 1;
        while(after < inner.length && /\s/.test(inner[after])) after++;
        if(inner[after] && /[\u1000-\u1021]/.test(inner[after])){
          blockRanges.push({start: cursor, end: m.index});
          cursor = m.index + 1;
        }
      }
      blockRanges.push({start: cursor, end: inner.length});
    }

    blockRanges.forEach(br => {
      const block = inner.slice(br.start, br.end);
      const tokens = tp_tokenize(block);
      if(tokens.length === 0) return;

      const res = tp_findBlockPrefix(idx, tokens);
      if(!res) return; // books.json ref_keys နှင့် လုံးဝမတိုက်ဆိုင်ရင် ဒီ block ကို ကျော်မည်

      const lastTok = tokens[res.upTo];
      const hasVolumeToken = /[\u1040-\u1049]/.test(lastTok.text);
      let baseLetterPrefixNorm = "";
      if(hasVolumeToken){
        for(let i = res.startIdx; i < res.upTo; i++) baseLetterPrefixNorm += normalizeRefKey(tokens[i].text);
      } else {
        for(let i = res.startIdx; i <= res.upTo; i++) baseLetterPrefixNorm += normalizeRefKey(tokens[i].text);
      }

      const remainderAbsOffset = br.start + lastTok.end;
      const remainderText = block.slice(lastTok.end);
      if(!remainderText.trim()) return;

      const groupSpans = tp_processRemainder(idx, remainderText, remainderAbsOffset, res.book, baseLetterPrefixNorm, hasVolumeToken);
      spans.push(...groupSpans);
    });

    spans.sort((a,b)=> a.start - b.start);
    return spans;
  }

  // toc.json ထဲမှာ ခေါင်းစဉ် (သုတ်/ဝတ္ထု/ကထာအမည်) ဖြင့် စာမျက်နှာရှာရန်
  async function findPageByTitle(bookId, titleText){
    const toc = await ensureToc();
    const target = normalizeRefKey(titleText);
    if(!target) return null;
    const items = toc.filter(t => t.book_id === bookId);
    let found = items.find(it => normalizeRefKey(it.name) === target);
    if(!found) found = items.find(it => normalizeRefKey(it.name).includes(target) || target.includes(normalizeRefKey(it.name)));
    return found ? found.page_number : null;
  }

  // #tp-content ထဲက (သု။ နိ။ ၈၈၁) စတဲ့ ကျမ်းညွန်းစာသားများကို ရှာပြီး နှိပ်နိုင်သော Link များအဖြစ် ပြောင်းလဲခြင်း
  async function linkifyCitations(containerEl){
    if(!containerEl) return;
    let idx;
    try{ idx = await ensureIndex(); }catch(e){ return; }

    const citationRegex = /\(([\u1000-\u109F][\u1000-\u109F\s,.\-]{1,300})\)/g;
    const walker = document.createTreeWalker(containerEl, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        return (node.parentElement && node.parentElement.closest(".tp-page-divider")) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
      }
    });
    const textNodes = [];
    let node;
    while(node = walker.nextNode()){
      citationRegex.lastIndex = 0;
      if(citationRegex.test(node.nodeValue)) textNodes.push(node);
    }

    textNodes.forEach(textNode => {
      const text = textNode.nodeValue;
      citationRegex.lastIndex = 0;
      let match;
      const allSpans = [];
      while((match = citationRegex.exec(text)) !== null){
        const inner = match[1];
        const innerAbsStart = match.index + 1; // "(" ကို ကျော်၍
        const spans = parseCitationSpans(idx, inner);
        spans.forEach(sp => allSpans.push({ start: innerAbsStart + sp.start, end: innerAbsStart + sp.end, bookId: sp.bookId, paraNum: sp.paraNum, title: sp.title }));
      }
      if(allSpans.length === 0) return;

      const frag = document.createDocumentFragment();
      let cursor = 0;
      allSpans.forEach(sp => {
        frag.appendChild(document.createTextNode(text.slice(cursor, sp.start)));
        const linkSpan = document.createElement("span");
        linkSpan.className = "tp-citation-link";
        linkSpan.textContent = text.slice(sp.start, sp.end);
        linkSpan.dataset.book = sp.bookId;
        if(sp.title != null) linkSpan.dataset.title = sp.title;
        else linkSpan.dataset.para = sp.paraNum;
        frag.appendChild(linkSpan);
        cursor = sp.end;
      });
      frag.appendChild(document.createTextNode(text.slice(cursor)));
      textNode.parentNode.replaceChild(frag, textNode);
    });

    containerEl.querySelectorAll(".tp-citation-link").forEach(el => {
      el.addEventListener("click", async () => {
        const bookId = el.dataset.book;
        let targetPage, highlightPara = null;
        if(el.dataset.title != null){
          targetPage = await findPageByTitle(bookId, el.dataset.title);
        } else {
          const paraNum = parseInt(el.dataset.para, 10);
          highlightPara = paraNum;
          targetPage = await findPageForParagraph(bookId, paraNum);
        }
        if(targetPage == null){ alert("ကိုးကားထားသော အပိုင်းကို မတွေ့ပါ။"); return; }
        openXrefSplit(bookId, targetPage, highlightPara);
      });
    });
  }

  // ကျမ်းညွန်းကို နှိပ်လိုက်သောအခါ Split View ဘေးတခြမ်းတွင် သက်ဆိုင်ရာစာမျက်နှာကို ဖွင့်ပြရန်
  async function openXrefSplit(bookId, pageNum, highlightPara){
    isNissayaOpen = false;
    const container = document.getElementById("tp-nissaya-container");
    const contentEl = document.getElementById("tp-nissaya-content");
    container.style.display = "block";
    contentEl.innerHTML = "<p class='tp-loading'>ကိုးကားချက် ဆွဲယူနေပါသည်...</p>";
    try{
      const idx = await ensureIndex();
      const bookMeta = findBookMetaByPageRange(idx, bookId, pageNum) || {};
      if(!bookPagesCache[bookId]) bookPagesCache[bookId] = await fetchBookPages(bookId);
      const rows = bookPagesCache[bookId];
      const row = rows.find(r => parseInt(r.page, 10) === pageNum);
      if(row){
        // ဘေးတခြမ်းစာမျက်နှာ ထိပ်ဆုံးမှာ ဒီစာမျက်နှာရဲ့ ကိုးကားချက် (ဥပမာ "(ဒီ၊၁၊၁။)") ကို ပြပြီး
        // နှိပ်လိုက်ရင် main page ဘက်တွင် ခါတိုင်းအတိုင်း သွားပြီး split view ကို ပိတ်မည်
        const citeLabel = document.createElement("div");
        citeLabel.className = "tp-citation-link";
        citeLabel.style.marginBottom = "10px";
        citeLabel.style.fontWeight = "bold";
        citeLabel.textContent = citationText(bookMeta, pageNum);
        citeLabel.addEventListener("click", () => {
          container.style.display = "none";
          loadPage(bookMeta.basket, bookMeta.category, bookId, pageNum, bookMeta.firstpage);
        });

        contentEl.innerHTML = "";
        contentEl.appendChild(citeLabel);
        const bodyWrap = document.createElement("div");
        bodyWrap.innerHTML = row.content;
        contentEl.appendChild(bodyWrap);

        if(highlightPara != null){
          bodyWrap.querySelectorAll(".paranum").forEach(pEl => {
            if(parseParanums(pEl.textContent).includes(highlightPara)){
              const wrap = pEl.closest("p,div") || pEl;
              wrap.classList.add("tp-mm-highlight");
              setTimeout(() => wrap.scrollIntoView({behavior:"smooth", block:"center"}), 50);
            }
          });
        }
      } else {
        contentEl.innerHTML = `<p style='color:red'>စာမျက်နှာ ${toMyanmarDigits(pageNum)} ကို မတွေ့ပါ။</p>`;
      }
    } catch(e){
      contentEl.innerHTML = `<p style='color:red'>ကိုးကားချက် ဖိုင်မရရှိနိုင်သေးပါ (${e.message})</p>`;
    }

    document.getElementById("tp-nissaya-close").addEventListener("click", () => {
      container.style.display = "none";
    });
  }

  function getParams(){ const p = new URLSearchParams(window.location.search); return { basket: p.get("basket") || "", category: p.get("category") || "", book: p.get("book") || "", firstpage: p.get("firstpage") ? parseInt(p.get("firstpage"),10) : null, page: p.get("page") ? parseInt(p.get("page"),10) : null }; }
  function setParams(obj){ const p = new URLSearchParams(); if(obj.basket) p.set("basket", obj.basket); if(obj.category) p.set("category", obj.category); if(obj.book) p.set("book", obj.book); if(obj.firstpage) p.set("firstpage", obj.firstpage); if(obj.page) p.set("page", obj.page); history.pushState({}, "", "?" + p.toString()); }

  function renderBreadcrumb(parts){
    const el = document.getElementById("tp-breadcrumb");
    el.innerHTML = parts.map((p,i) => { const sep = i>0 ? " › " : ""; return p.onclick ? sep + `<a data-idx="${i}">${p.label}</a>` : sep + p.label; }).join("");
    parts.forEach((p,i) => { if(p.onclick) el.querySelector(`a[data-idx="${i}"]`).addEventListener("click", p.onclick); });
  }

    document.getElementById("tp-view").innerHTML = `<p class="tp-loading">Loading...</p>`;

  async function fetchBookPages(bookId){ return fetchJson(cdnUrl(`${DATA_FOLDER}/${bookId}.json`)); }
  function findBookMeta(idx, bookId, firstpageHint){ const matches = idx.books.filter(b=>b.id===bookId); if(matches.length<=1) return matches[0]; if(firstpageHint!=null){ const exact = matches.find(b=>b.firstpage===firstpageHint); if(exact) return exact; } return matches[0]; }

  // နိဿယ Split View ဖော်ပြမည့် Function
  // Split View နိဿယထဲက ကိုးကားချက်များ (ဥပမာ ဒီ၊ဋီ၊၂၊၄၀) ကို reader ထဲက စာမျက်နှာဖွင့်ပေးနိုင်တဲ့ လင့်များ ပြောင်းပေးသည်
  async function tp_nissayaLinkify(htmlText){
    try{ await tp_sayEnsureRefs(); }catch(e){ return htmlText; }
    // လက်ရိုက်မူထဲမှာ "သုတ္တ နိ" လို အမည်တစ်ခုတည်းကို ကြားက space ခြားရေးထားတာမျိုး လင့်မလွဲစေရန် ဖျောက်ပေးမည်
    htmlText = htmlText.replace(/သုတ္တ\s+နိ(?=[၊\-]\s*[၀-၉])/g, "သုတ္တနိ");
    const refs = tp_sayFindRefs(htmlText);
    if(!refs.length) return htmlText;
    let out = "", last = 0;
    refs.forEach(r => {
      out += htmlText.slice(last, r.start);
      const seg = htmlText.slice(r.start, r.end);
      out += r.mmBook

  // Scroll ဖတ်နိုင်ရန် တည်ဆောက်ပေးသည့် Helper function
  function buildStitchedPageHtml(rows, row, pageNum, bookMeta){
    const prevRow = rows.find(r => parseInt(r.page,10) === pageNum - 1);
    const nextRow = rows.find(r => parseInt(r.page,10) === pageNum + 1);
    let html = "";
    if(prevRow){
      html += `<div class="tp-adjacent-page tp-prev-page">${prevRow.content}</div>`;
      html += `<div class="tp-page-divider">${citationText(bookMeta, pageNum)}</div>`;
    }
    html += `<div id="tp-current-page">${row.content}</div>`;
    if(nextRow){
      html += `<div class="tp-page-divider">${citationText(bookMeta, nextRow.page)}</div>`;
      html += `<div class="tp-adjacent-page tp-next-page">${nextRow.content}</div>`;
    }
    return html;
  }

  function scrollToCurrentPage(){
    const contentEl = document.getElementById("tp-content"), curEl = document.getElementById("tp-current-page");
    if(!contentEl || !curEl) return;
    const contentRect = contentEl.getBoundingClientRect(), curRect = curEl.getBoundingClientRect();
    contentEl.scrollTop += (curRect.top - contentRect.top);
  }

  // GitHub ကရရှိသော idx.books/idx.basket_labels မှတဆင့် စာအုပ် တစ်အုပ်စီက ဝိနည်း/သုတ္တန်/အဘိဓမ္မာ/အခြား ဘယ်အပိုင်းလဲ သိရန်
  // book.category ရဲ့ တိကျသော short code (vi/di/ma/sa/an/ku/bi/annya_*) ကို
  // ဝိနည်း/သုတ္တန်/အဘိဓမ္မာ/အခြား scope လေးခုအဖြစ် တိုက်ရိုက် ခွဲခြားမည်
  const TP_FTS_CATEGORY_TO_SCOPE = {
    vi: "vinaya",
    di: "sutta", ma: "sutta", sa: "sutta", an: "sutta", ku: "sutta",
    bi: "abhidhamma",
    annya_vi: "other", annya_bi: "other", annya_sadda: "other"
  };

  async function tp_ftsEnsureScopeMap(){
    if(tp_ftsScopeMap) return tp_ftsScopeMap;
    const idx = await ensureIndex();
    tp_ftsScopeMap = {};
    for(const b of (idx.books || [])){
      tp_ftsScopeMap[b.id] = TP_FTS_CATEGORY_TO_SCOPE[b.category] || "other";
    }
    return tp_ftsScopeMap;
  } // ယခု အသုံးမပြုတော့ပါ (tp_ftsBookMatchesScope က tp_ftsBooksMap ကို တိုက်ရိုက်သုံးသည်) - backward-compat အတွက်သာ ချန်ထားသည်

  function tp_ftsGetSelectedScopes(scopeBoxes){
    return Array.from(scopeBoxes).filter(b => b.checked).map(b => b.value);
  }
  // ပြဿနာရှာတွေ့ချက်: ယခင်က GitHub books.json (idx.books) ကို အခြေခံ၍ scopeMap (book_id -> scope)
  // ကို သီးခြား ဆောက်ခဲ့ရာ၊ GitHub ရဲ့ book id ပုံစံသည် Firebase part2 ရဲ့ book_id ပုံစံနှင့်
  // အမြဲတမ်း အတိအကျ ကိုက်ညီမည်ဟု အာမမခံနိုင်ပါ (data source နှစ်ခု သီးခြားစီ ထိန်းသိမ်းထားသည်)။
  // ဒါကြောင့် scope အများစု (ဥပမာ "အဘိဓမ္မာ" တစ်ခုတည်း ရွေးလိုက်ရင်) က ရလဒ်တွေ ရှိရဲ့သားနဲ့
  // လုံးဝ မတွေ့ဘဲ ဖြစ်နေခဲ့ပါသည်။ ပြင်ဆင်ချက်: Firebase ကိုယ်တိုင် part3 (tp_ftsBooksMap) ထဲမှာ
  // .category/.basket field ပါပြီးသားဖြစ်ပြီး ၎င်းသည် part2.book_id အတိုင်းပင် key ချထားသည်
  // (tp_ftsOpenResult တွင်လည်း ဤနည်းအတိုင်း အားကိုးအသုံးပြုနေပြီးသား) ဒီနေရာမှာလည်း
  // tp_ftsBooksMap ကိုပဲ တိုက်ရိုက် သုံးလိုက်ခြင်းဖြင့် ကိုက်ညီမှု အမြဲ သေချာစေသည်
  function tp_ftsBookMatchesScope(bookId, scopes){
    if(scopes.length === 0) return false; // ဘာမှ မရွေးထားရင် ဘာမှ မရှာရ
    if(scopes.includes("current") && bookId === String(currentBookId || "").trim()) return true;
    const book = tp_ftsBooksMap[bookId];
    const cat = book ? (TP_FTS_CATEGORY_TO_SCOPE[book.category] || "other") : "other";
    return scopes.includes(cat);
  }

  function tp_ftsStripPunctuation(text){
    if(!text) return "";
    return text.replace(/[,.?၊။!""''«»()\-[\]{}—]/g, " ");
  }
  function tp_ftsToBurmeseNumerals(num){
    if(num === null || num === undefined) return "";
    const d = ["၀","၁","၂","၃","၄","၅","၆","၇","၈","၉"];
    return String(num).replace(/\d/g, x => d[x]);
  }
  function tp_ftsFormattedBookTitle(bookId, pageNo){
    const burmesePageNo = tp_ftsToBurmeseNumerals(pageNo);
    const cleanId = String(bookId || "").trim();
    const book = tp_ftsBooksMap[cleanId];
    if(book){
      let shortName = (book.short_name || "").trim();
      if(shortName && !shortName.endsWith("၊")) shortName += "၊";
      return `${book.name} (${shortName}${burmesePageNo}။)`;
    }
    return `စာအုပ် ID: ${bookId} (စာမျက်နှာ: ${burmesePageNo})`;
  }
  const TP_FTS_ALLOWED_TAGS = new Set(["B","STRONG","I","EM","U","H1","H2","H3","H4","H5","H6","SUP","SUB"]);

  function tp_ftsPlainTextFromHtml(html){
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = html || "";
    let plainText = tempDiv.textContent || tempDiv.innerText || "";
    plainText = plainText.replace(/\[[^\]]*\]/g, " "); // [...] ကွင်းစကားများကို ရေတွက်မှုမှ ဖယ်ရှားမည်
    return plainText;
  }

  // Content HTML ကို စာသား node များ (text nodes) အတိုင်း လိုက်လျှောက်ပြီး၊
  // "text" = မူရင်းစာသား အတိအကျ (ပုံဖော်ရန် သုံးမည်)၊ "matchText" = အလားတူ length ရှိပေမယ့် ',' '.' '၊' '။' '-' '?'
  // နှင့် [...] ကွင်းစာများကို space ဖြင့် blank ထားသော string (ရှာဖွေတိုက်ဆိုင်ရန် သုံးမည်) ကို ပြန်ပေးမည်
  function tp_ftsBuildPlainProjection(container){
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
    let text = "", matchText = "";
    const nodeMap = [];
    let node;
    while((node = walker.nextNode())){
      const val = node.nodeValue;
      if(!val) continue;
      const start = text.length;
      text += val;
      let mv = val.replace(/\[[^\]]*\]/g, m => " ".repeat(m.length));
      mv = tp_ftsStripPunctuation(mv);
      matchText += mv;
      nodeMap.push({ node, start, end: text.length });
    }
    return { text, matchText, nodeMap };
  }

  function tp_ftsFindAncestorFormatTag(node){
    let el = node.parentElement;
    while(el){
      if(TP_FTS_ALLOWED_TAGS.has(el.tagName)) return el.tagName;
      el = el.parentElement;
    }
    return null;
  }

  // text[start,end) ကို HTML အနေနှင့် ပြန်တည်ဆောက်မည် - <b>/<h2>/... စသော format tag များကို ထိန်းသိမ်းထားပြီး
  // [highlightStart,highlightEnd) ကို အပြာရောင် highlight လုပ်ပေးမည်
  function tp_ftsSliceToHtml(text, nodeMap, start, end, highlightStart, highlightEnd){
    let html = "";
    for(const entry of nodeMap){
      const segStart = Math.max(start, entry.start);
      const segEnd = Math.min(end, entry.end);
      if(segStart >= segEnd) continue;
      const tag = tp_ftsFindAncestorFormatTag(entry.node);
      const hs = Math.max(segStart, highlightStart), he = Math.min(segEnd, highlightEnd);
      let inner;
      if(hs < he){
        const pre = tp_ftsEscapeHtml(text.slice(segStart, hs));
        const mid = tp_ftsEscapeHtml(text.slice(hs, he));
        const post = tp_ftsEscapeHtml(text.slice(he, segEnd));
        inner = pre + `<span class="tp-fts-highlight">${mid}</span>` + post;
      } else {
        inner = tp_ftsEscapeHtml(text.slice(segStart, segEnd));
      }
      html += tag ? `<${tag.toLowerCase()}>${inner}</${tag.toLowerCase()}>` : inner;
    }
    return html;
  }

  // ရလဒ်စာရင်းထဲက snippet ကို "စာမျက်နှာအစ" အစား "ရှာဖွေထားသော စာသား ပါဝင်ရာ ဝန်းကျင်" ကို ပြပြီး၊
  // ရှာဖွေထားသော စကားလုံး/စကားစုကို အပြာရောင်ဖြင့် highlight ပြုလုပ်ပြီး၊ <b>/<h2> စသော format ကိုလည်း ထိန်းသိမ်းမည်
  function tp_ftsExtractSnippet(html, words){
    const container = document.createElement("div");
    container.innerHTML = html || "";
    container.querySelectorAll("script,style").forEach(el => el.remove());

    const { text, matchText, nodeMap } = tp_ftsBuildPlainProjection(container);
    const phrase = words.join(" ");

    let idx = matchText.indexOf(phrase);
    let matchLen = phrase.length;
    if(idx === -1){
      for(const w of words){
        idx = matchText.indexOf(w);
        if(idx !== -1){ matchLen = w.length; break; }
      }
    }

    if(idx === -1){
      const trimmed = text.trim();
      return trimmed.length > 130 ? tp_ftsEscapeHtml(trimmed.slice(0, 130)) + "..." : tp_ftsEscapeHtml(trimmed);
    }

    const start = Math.max(0, idx - 50);
    const end = Math.min(text.length, idx + matchLen + 70);
    const bodyHtml = tp_ftsSliceToHtml(text, nodeMap, start, end, idx, idx + matchLen);
    return (start > 0 ? "..." : "") + bodyHtml + (end < text.length ? "..." : "");
  }

  function tp_ftsEscapeHtml(s){
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // စာမျက်နှာ ဖွင့်လိုက်ပြီးနောက် ရှာဖွေထားသော စကားလုံးများကို content ထဲမှာ အပြာရောင် highlight လုပ်ပေးမည်
  // (HTML structure မပျက်အောင် TreeWalker ဖြင့် စာသား node များကိုသာ ရှာပြီး လုပ်ဆောင်သည်)
  function tp_ftsHighlightWordsInElement(containerEl, words){
    if(!containerEl || !words || words.length === 0) return;
    const uniqueWords = [...new Set(words.filter(Boolean))].sort((a, b) => b.length - a.length);
    if(uniqueWords.length === 0) return;

    const walker = document.createTreeWalker(containerEl, NodeFilter.SHOW_TEXT, null);
    const textNodes = [];
    let node;
    while((node = walker.nextNode())) textNodes.push(node);

    for(const textNode of textNodes){
      const text = textNode.nodeValue;
      let hasMatch = false;
      for(const w of uniqueWords){ if(text.includes(w)){ hasMatch = true; break; } }
      if(!hasMatch) continue;

      const frag = document.createDocumentFragment();
      let i = 0;
      while(i < text.length){
        let matchedWord = null;
        for(const w of uniqueWords){ if(text.startsWith(w, i)){ matchedWord = w; break; } }
        if(matchedWord){
          const span = document.createElement("span");
          span.className = "tp-fts-highlight";
          span.textContent = matchedWord;
          frag.appendChild(span);
          i += matchedWord.length;
        } else {
          let j = i + 1;
          outer: while(j < text.length){
            for(const w of uniqueWords){ if(text.startsWith(w, j)) break outer; }
            j++;
          }
          frag.appendChild(document.createTextNode(text.slice(i, j)));
          i = j;
        }
      }
      textNode.parentNode.replaceChild(frag, textNode);
    }
  }

  // စာမျက်နှာ ဖွင့်ရေး Card ကို click လုပ်လိုက်ရင် App ရဲ့ ပုံမှန် navigation (loadPage) အတိုင်းပဲ ဖွင့်ပေးမည်
  // ဒါမှ TOC breadcrumb, Dictionary, နိဿယ, ဘာသာပြန် စတဲ့ features အားလုံး ဆက်လက် အလုပ်လုပ်နိုင်မည်
  // Panel ကို GitHub idx.books နဲ့ မတိုက်ဘဲ Firebase ရဲ့ part3 (tp_ftsBooksMap) ကိုသာ တိုက်သည် -
  // ဒါမှ part2/part3 ရဲ့ book_id ပုံစံ အတူတူဖြစ်ပြီး ကိုက်ညီမှု သေချာမည်
  async function tp_ftsOpenResult(pageInfo, statusDiv, words){
    if(window.innerWidth <= 900){ const fp = document.getElementById("tp-fts-panel"); if(fp) fp.classList.remove("tp-open"); }   // ဖုန်း — ရလဒ်တွေ မပျက်ဘဲ box ခဏပိတ်ထားမည်
    const bookId = String(pageInfo.book_id || "").trim();
    const pageNum = Number(pageInfo.page);
    const meta = tp_ftsBooksMap[bookId];
    if(!meta){ if(statusDiv) statusDiv.innerHTML = `<span style='color:red;'>ဒီစာမျက်နှာအတွက် စာအုပ်အချက်အလက် မတွေ့ပါ (book_id: ${bookId})။</span>`; return; }
    if(statusDiv) statusDiv.innerText = "စာမျက်နှာ ဖွင့်နေပါသည်...";
    await loadPage(meta.basket, meta.category, bookId, pageNum, meta.firstpage);
    const contentEl = document.getElementById("tp-current-page");
    if(contentEl && words && words.length) tp_ftsHighlightWordsInElement(contentEl, words);
    if(statusDiv) statusDiv.innerText = "";
  }

  const TP_FTS_PAGE_SIZE = 20;
  // FTS ရလဒ်များကို ၂၀ ခုတစ်တွဲစီ ခွဲပြသည်။ "နောက်ရလာဒ်" နှိပ်တိုင်း နောက်တွဲကို ဆက်ပြမည်၊
  // နောက်ဆုံးတွဲပြီးလျှင် အစက ၂၀ ခုသို့ ပြန်ရောက်စေမည်
  async function tp_ftsRenderResultsPage(list, words, resultsDiv, statusDiv, offset){
    resultsDiv.innerHTML = "";
    const shown = list.slice(offset, offset + TP_FTS_PAGE_SIZE);
    if(shown.some(p => p.content == null)){       // GitHub static ဗားရှင်း — ပြမယ့် ၂၀ ခုရဲ့ စာသားကိုပဲ ယူမည်
      resultsDiv.innerHTML = '<div class="tp-fts-content-snippet">စာမျက်နှာများ ဖွင့်နေပါသည်...</div>';
      try{ await Promise.all(shown.map(async p => { if(p.content == null) p.content = await tp_ftsPageContent(p.pid); })); }
      catch(e){ resultsDiv.innerHTML = `<div style="color:red">စာမျက်နှာများ ဖတ်၍မရပါ (${e.message})</div>`; return; }
      resultsDiv.innerHTML = "";
    }
    shown.forEach(pageInfo => {
      const cleanedText = tp_ftsExtractSnippet(pageInfo.content || "", words);
      const formattedTitle = tp_ftsFormattedBookTitle(pageInfo.book_id, pageInfo.page);
      const card = document.createElement("div");
      card.className = "tp-fts-result-card";
      card.innerHTML = `<div class="tp-fts-book-title">${formattedTitle}</div><div class="tp-fts-content-snippet">${cleanedText}</div>`;
      card.addEventListener("click", () => tp_ftsOpenResult(pageInfo, statusDiv, words));
      resultsDiv.appendChild(card);
    });
    if(list.length > TP_FTS_PAGE_SIZE){
      const nextLink = document.createElement("div");
      nextLink.className = "tp-fts-next-link";
      nextLink.textContent = "နောက်ရလာဒ်";
      nextLink.addEventListener("click", () => {
        const nextOffset = (offset + TP_FTS_PAGE_SIZE >= list.length) ? 0 : offset + TP_FTS_PAGE_SIZE;
        tp_ftsRenderResultsPage(list, words, resultsDiv, statusDiv, nextOffset);
      });
      resultsDiv.appendChild(nextLink);
    }
  }

  // ပိဋကတ်တော် ရှာဖွေရေး panel ကို တစ်ခါတည်း ဆောက်ပြီး document.body အောက်မှာ ခန့်ထားမည်
  // (loadPage() run တိုင်း #tp-view ကို ပြန်တည်ဆောက်နေလို့၊ panel ကို အဲဒီထဲ မထားဘဲ body level မှာ ထားမှ
  //  စာမျက်နှာ ပြောင်းနေချိန်လည်း panel မပျောက်ဘဲ ဆက်ပေါ်နေနိုင်မည်)
  let tp_ftsPanelBuilt = false;
  function tp_ensureFtsPanel(){
    let panel = document.getElementById("tp-fts-panel");
    if(panel && tp_ftsPanelBuilt) return panel;

    if(!panel){
      panel = document.createElement("div");
      panel.id = "tp-fts-panel";
      document.body.appendChild(panel);
    }
    panel.innerHTML = `
      <div class="tp-topbar"><div class="tp-tabs"><button data-t="data">📚 အဘိဓာန်/ကျမ်းညွှန်း</button><button data-t="fts" class="on">📖 ပိဋကတ်စာ</button></div><span class="tp-fts-menu tp-tb-btn" title="ရှာဖွေရေး အမျိုးအစား ပြောင်းရန်">☰</span><span class="tp-fts-close tp-tb-btn" title="ပိတ်မည်">✕</span></div>
      <div class="tp-fts-scope-row">
        <label><input type="checkbox" class="tp-fts-scope" value="current" checked> လက်ရှိကျမ်းစာ</label>
        <label><input type="checkbox" class="tp-fts-scope" value="vinaya" checked> ဝိနည်း</label>
        <label><input type="checkbox" class="tp-fts-scope" value="sutta" checked> သုတ္တန်</label>
        <label><input type="checkbox" class="tp-fts-scope" value="abhidhamma" checked> အဘိဓမ္မာ</label>
        <label><input type="checkbox" class="tp-fts-scope" value="other" checked> အခြား</label>
      </div>
      <div class="tp-fts-search-container">
        <input type="text" id="tp-fts-input" placeholder="စကားလုံး သို့မဟုတ် စကားစု ရိုက်ထည့်ပါ..." autocomplete="off">
        <div id="tp-fts-autocomplete" class="tp-fts-autocomplete"></div>
      </div>
      <div id="tp-fts-status" class="tp-fts-status"></div>
      <div id="tp-fts-results" class="tp-fts-results"></div>
    `;

    panel.querySelector(".tp-fts-close").addEventListener("click", () => { panel.classList.remove("tp-open"); document.body.classList.remove("tp-say-docked"); });
    panel.querySelectorAll(".tp-tabs button").forEach(b => b.addEventListener("click", () => tp_tabTo(b.dataset.t, b)));
    panel.querySelector(".tp-fts-menu").addEventListener("click", e => { e.stopPropagation(); tp_openSearchChoice(e.currentTarget, null, true); });
    const input = panel.querySelector("#tp-fts-input");
    const autocompleteList = panel.querySelector("#tp-fts-autocomplete");
    const statusDiv = panel.querySelector("#tp-fts-status");
    const resultsDiv = panel.querySelector("#tp-fts-results");
    const scopeBoxes = panel.querySelectorAll(".tp-fts-scope");
    const ui = { input, autocompleteList, statusDiv, resultsDiv, scopeBoxes };

    let debounceTimer;
    input.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      const text = input.value;
      if(!text.trim()){ autocompleteList.innerHTML = ""; return; }
      debounceTimer = setTimeout(() => {
        if(/\s$/.test(text)) tp_ftsSuggestNextWords(text, ui);
        else tp_ftsFetchSuggestions(text, ui);
      }, 300);
    });
    input.addEventListener("click", (e) => e.stopPropagation());
    input.addEventListener("keypress", (e) => {
      if(e.key === "Enter"){ autocompleteList.innerHTML = ""; tp_ftsSearchPhrase(ui); }
    });
    panel.addEventListener("click", (e) => {
      if(e.target !== input && !e.target.closest("#tp-fts-autocomplete")) autocompleteList.innerHTML = "";
    });

    // အပိုင်း (scope) checkbox တစ်ခုခု ဖြုတ်/တပ် လုပ်လိုက်တိုင်း၊ ရှာဖွေထားပြီးသား စကားစု ရှိပါက
    // အလိုအလျောက် ပြန်တွက်ချက်ပြီး တွေ့ရှိချက်အရေအတွက်ကို update လုပ်ပေးမည်
    scopeBoxes.forEach(box => {
      box.addEventListener("change", () => {
        if(input.value.trim()) tp_ftsSearchPhrase(ui);
      });
    });

    tp_ftsPanelBuilt = true;
    return panel;
  }

  async function tp_ftsFetchSuggestions(inputText, ui){
    { const S = await tp_ftsSInit(); if(S) return tp_ftsSuggestStatic(inputText, ui, S); }
    try{
      const db = await tp_ensureFtsDb();
      const { ref, query, orderByChild, equalTo, startAt, endAt, limitToFirst, get } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js");
      await tp_ftsLoadBooksMap(db, ref, get);

      const cleaned = tp_ftsStripPunctuation(inputText);
      const words = cleaned.trim().split(/\s+/).filter(Boolean);
      if(words.length === 0) return;

      const lastWord = words[words.length - 1];
      const prefixWords = words.slice(0, -1);

      let prefixPageIds = null;
      if(prefixWords.length > 0){
        const prefixSnaps = await Promise.all(prefixWords.map(w => get(query(ref(db, "part1"), orderByChild("word"), equalTo(w)))));
        let sets = [];
        for(const snap of prefixSnaps){
          if(!snap.exists()){ ui.autocompleteList.innerHTML = ""; return; }
          const wordData = Object.values(snap.val())[0];
          const ids = String(wordData.rowids || "").split(",").map(item => item.split("_")[0]).filter(Boolean);
          sets.push(new Set(ids));
        }
        prefixPageIds = sets[0];
        for(let i = 1; i < sets.length; i++) prefixPageIds = new Set([...prefixPageIds].filter(id => sets[i].has(id)));
        if(prefixPageIds.size === 0){ ui.autocompleteList.innerHTML = ""; return; }
      }

      const qWord = query(ref(db, "part1"), orderByChild("word"), startAt(lastWord), endAt(lastWord + "\uf8ff"), limitToFirst(100));
      const snap = await get(qWord);
      ui.autocompleteList.innerHTML = "";

      if(snap.exists()){
        const matches = Object.values(snap.val());
        const prefixStr = prefixWords.join(" ");
        let displayedCount = 0;
        for(const item of matches){
          if(displayedCount >= 20) break;
          if(prefixPageIds){
            const candidateIds = String(item.rowids || "").split(",").map(i => i.split("_")[0]).filter(Boolean);
            if(!candidateIds.some(id => prefixPageIds.has(id))) continue;
          }
          const suggestedFullPhrase = prefixStr ? `${prefixStr} ${item.word}` : item.word;
          const div = document.createElement("div");
          div.innerText = suggestedFullPhrase;
          div.addEventListener("click", () => {
            ui.input.value = suggestedFullPhrase;
            ui.autocompleteList.innerHTML = "";
            tp_ftsSearchPhrase(ui);
          });
          ui.autocompleteList.appendChild(div);
          displayedCount++;
        }
      }
    }catch(e){ /* autocomplete ဆိုတာ non-critical ဖြစ်လို့ error ကို ဆက်လက် လျစ်လျူရှုသည် */ }
  }

  // Space ရိုက်ပြီးနောက် "ဒီစကားစုနောက်ကို ဘယ်စာလုံးများ ဆက်လာလေ့ရှိလဲ" ဆိုတာကို
  // Firebase part1 မှာ position-index (ဘယ်စာလုံးက ဘယ်နေရာ) သီးခြား မရှိသေးလို့၊
  // ရှိပြီးသား rowids (pageId_position) ကို သုံးပြီး ပါဝင်ရာ စာမျက်နှာအချို့ (part2) ရဲ့ စာသားထဲက
  // ဒီစကားစုနောက် အမှန်တကယ် ဆက်ပါလာသော စာလုံးများကို တိုက်ရိုက် ရှာဖတ်ပြီး အကြံပြုပေးမည်
  async function tp_ftsSuggestNextWords(inputText, ui){
    { const S = await tp_ftsSInit(); if(S) return tp_ftsSuggestStatic(inputText, ui, S); }
    try{
      const db = await tp_ensureFtsDb();
      const { ref, query, orderByChild, equalTo, get } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js");

      const cleaned = tp_ftsStripPunctuation(inputText);
      const words = cleaned.trim().split(/\s+/).filter(Boolean);
      if(words.length === 0){ ui.autocompleteList.innerHTML = ""; return; }

      const phrase = words.join(" ");
      const lastWord = words[words.length - 1];
      const snap = await get(query(ref(db, "part1"), orderByChild("word"), equalTo(lastWord)));
      ui.autocompleteList.innerHTML = "";
      if(!snap.exists()) return;

      const wordData = Object.values(snap.val())[0];
      const pageIds = String(wordData.rowids || "").split(",").map(r => r.split("_")[0]).filter(Boolean);
      const uniquePageIds = [...new Set(pageIds)].slice(0, 6); // နမူနာ စာမျက်နှာ ၆ မျက်နှာအထိ ကြည့်မည်
      if(uniquePageIds.length === 0) return;

      const pageSnaps = await Promise.all(uniquePageIds.map(pid => get(query(ref(db, "part2"), orderByChild("id"), equalTo(Number(pid))))));
      const suggestionCounts = new Map();

      for(const pageSnap of pageSnaps){
        if(!pageSnap.exists()) continue;
        const pageInfo = Object.values(pageSnap.val())[0];
        const plain = tp_ftsPlainTextFromHtml(pageInfo.content || "");
        const normalized = tp_ftsStripPunctuation(plain);
        let from = 0;
        while(true){
          const idx = normalized.indexOf(phrase, from);
          if(idx === -1) break;
          const after = normalized.slice(idx + phrase.length).trimStart();
          const m = after.match(/^([\u1000-\u109F]+)/); // ဆက်လက်ပါဝင်သော မြန်မာစာလုံးအုပ်စုကို ယူမည်
          if(m && m[1]) suggestionCounts.set(m[1], (suggestionCounts.get(m[1]) || 0) + 1);
          from = idx + phrase.length;
        }
      }

      const ranked = [...suggestionCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 15);
      for(const [nextWord] of ranked){
        const suggestedFullPhrase = `${phrase} ${nextWord}`;
        const div = document.createElement("div");
        div.innerText = suggestedFullPhrase;
        div.addEventListener("click", () => {
          ui.input.value = suggestedFullPhrase;
          ui.autocompleteList.innerHTML = "";
          tp_ftsSearchPhrase(ui);
        });
        ui.autocompleteList.appendChild(div);
      }
    }catch(e){ /* non-critical */ }
  }


  // ==========================================================================================
  // GitHub (tipitaka-fts repo) ပေါ်က static shard တွေကို သုံးတဲ့ ရှာဖွေရေး — Firebase မလိုတော့ပါ
  //   windex.json  = စာလုံး shard တစ်ခုချင်းစီရဲ့ ပထမဆုံးစာလုံး (binary search အတွက်)
  //   w/N.json     = [[စာလုံး, "စာမျက်နှာ:တည်နေရာ,..."], ...]  (တည်နေရာ = စာမျက်နှာထဲက စာလုံးအစဉ်နံပါတ်၊ base36 delta)
  //   pagemap.json = [[ပထမ id, နောက်ဆုံး id, book_id, ပထမ စာမျက်နှာနံပါတ်], ...]
  //   p/K.json     = [[id, content], ...]  (id ၅၀ စီ)
  // တည်နေရာ (position) ရှိတာကြောင့် စကားစုကို ဆက်တိုက်ပါသလား တိတိကျကျ စစ်နိုင်သည်
  // ==========================================================================================
  const TP_FTS_BASE = (new URLSearchParams(location.search).get("fts")) || "https://sayadawtejinda.github.io/tipitaka-fts/";
  let tp_ftsSP = null; const tp_ftsShardCache = {}, tp_ftsPShardCache = {};
  function tp_ftsSInit(){
    if(!tp_ftsSP) tp_ftsSP = (async () => {
      try{
        const [wi, runs] = await Promise.all([fetchJson(TP_FTS_BASE + "windex.json"), fetchJson(TP_FTS_BASE + "pagemap.json")]);
        const idx = await ensureIndex();
        (idx.books || []).forEach(b => { if(!tp_ftsBooksMap[b.id]) tp_ftsBooksMap[b.id] = b; });
        return { wi, runs };
      }catch(e){ return null; }        // မရရင် Firebase နည်းလမ်းဟောင်းကို ဆက်သုံးမည်
    })();
    return tp_ftsSP;
  }
  // စာလုံးကို index နဲ့ တူညီအောင် ရှင်းလင်းခြင်း (ဗမာစာလုံး/ဂဏန်း/အင်္ဂလိပ်အက္ခရာမှလွဲ၍ ကျန်တာအားလုံး ခြားစာလုံး)
  function tp_ftsNormWords(text){
    return String(text || "").replace(/[​‌‍⁠﻿]/g, "").replace(/\[[^\]]*\]/g, " ").replace(/[^က-၉၌-႟0-9A-Za-z]+/g, " ").split(" ").filter(Boolean);
  }
  function tp_ftsShard(k){
    if(!tp_ftsShardCache[k]) tp_ftsShardCache[k] = fetchJson(TP_FTS_BASE + "w/" + k + ".json").catch(e => { delete tp_ftsShardCache[k]; throw e; });
    return tp_ftsShardCache[k];
  }
  function tp_ftsShardOf(wi, w){
    let lo = 0, hi = wi.length - 1;
    while(lo < hi){ const mid = (lo + hi + 1) >> 1; if(wi[mid] <= w) lo = mid; else hi = mid - 1; }
    return lo;
  }
  function tp_ftsLowerBound(sh, w){
    let lo = 0, hi = sh.length;
    while(lo < hi){ const mid = (lo + hi) >> 1; if(sh[mid][0] < w) lo = mid + 1; else hi = mid; }
    return lo;
  }
  async function tp_ftsPosting(S, w){
    const sh = await tp_ftsShard(tp_ftsShardOf(S.wi, w));
    const i = tp_ftsLowerBound(sh, w);
    return (i < sh.length && sh[i][0] === w) ? sh[i][1] : null;
  }
  // prefix နဲ့စတဲ့ စာလုံးများ (အများဆုံး limit ခု)
  async function tp_ftsPrefix(S, prefix, limit){
    const out = []; let k = tp_ftsShardOf(S.wi, prefix);
    while(k < S.wi.length && out.length < limit){
      const sh = await tp_ftsShard(k);
      let i = tp_ftsLowerBound(sh, prefix), ended = false;
      for(; i < sh.length && out.length < limit; i++){
        if(sh[i][0].startsWith(prefix)) out.push(sh[i]); else { ended = true; break; }
      }
      if(ended) break;
      k++;
    }
    return out;
  }
  function tp_ftsDecode(str){
    const m = new Map(); let pid = 0;
    String(str).split(";").forEach(seg => {
      const c = seg.indexOf(":"); pid += parseInt(seg.slice(0, c), 36);
      let last = 0; m.set(pid, seg.slice(c + 1).split(",").map(x => (last += parseInt(x, 36))));
    });
    return m;
  }
  function tp_ftsPageMeta(S, pid){
    const r = S.runs; let lo = 0, hi = r.length - 1;
    while(lo < hi){ const mid = (lo + hi + 1) >> 1; if(r[mid][0] <= pid) lo = mid; else hi = mid - 1; }
    const run = r[lo];
    if(!run || pid < run[0] || pid > run[1]) return null;
    return { pid, book_id: run[2], page: run[3] + (pid - run[0]) };
  }
  async function tp_ftsPageContent(pid){
    const k = Math.floor(pid / 50);
    if(!tp_ftsPShardCache[k]) tp_ftsPShardCache[k] = fetchJson(TP_FTS_BASE + "p/" + k + ".json").then(a => { const m = {}; a.forEach(x => { m[x[0]] = x[1]; }); return m; }).catch(e => { delete tp_ftsPShardCache[k]; throw e; });
    return (await tp_ftsPShardCache[k])[pid] || "";
  }
  // စကားစုကို တည်နေရာနဲ့ စစ်ပြီး { phrasePages:[pid], allPages:[pid] , ends: Map(pid -> နောက်ဆုံးစာလုံး တည်နေရာများ) } ပြန်ပေးသည်
  async function tp_ftsFind(S, words){
    const posts = await Promise.all(words.map(w => tp_ftsPosting(S, w)));
    const miss = words.find((w, i) => posts[i] == null);
    if(miss !== undefined) return { missing: miss };
    const maps = posts.map(tp_ftsDecode);
    let small = maps[0]; maps.forEach(m => { if(m.size < small.size) small = m; });
    const all = [], phrase = [], ends = new Map();
    for(const pid of small.keys()){
      if(!maps.every(m => m.has(pid))) continue;
      all.push(pid);
      if(words.length === 1){ phrase.push(pid); ends.set(pid, maps[0].get(pid)); continue; }
      const rest = maps.slice(1).map(m => new Set(m.get(pid)));
      const hit = maps[0].get(pid).filter(p => rest.every((set, i) => set.has(p + i + 1)));
      if(hit.length){ phrase.push(pid); ends.set(pid, hit.map(p => p + words.length - 1)); }
    }
    all.sort((a, b) => a - b); phrase.sort((a, b) => a - b);
    return { all, phrase, ends };
  }
  async function tp_ftsSearchStatic(ui, S){
    const { input, statusDiv, resultsDiv, scopeBoxes } = ui;
    const words = tp_ftsNormWords(input.value);
    if(words.length === 0){ statusDiv.innerText = "ကျေးဇူးပြု၍ စကားလုံး သို့မဟုတ် စကားစု ရိုက်ထည့်ပါ။"; return; }
    const selectedScopes = tp_ftsGetSelectedScopes(scopeBoxes);
    if(selectedScopes.length === 0){ statusDiv.innerHTML = `<span style='color:red;'>ရှာဖွေရန် အနည်းဆုံး တစ်ခု ရွေးချယ်ပါ။</span>`; return; }
    statusDiv.innerText = "ရှာဖွေနေပါသည်... ခဏစောင့်ပါ။";
    try{
      const res = await tp_ftsFind(S, words);
      if(res.missing !== undefined){ statusDiv.innerHTML = `<span style='color:red;'>"${res.missing}" ဟူသော စကားလုံး ကျမ်းစာထဲတွင် မရှိပါ။</span>`; return; }
      if(!res.all.length){ statusDiv.innerHTML = `<span style='color:red;'>စကားလုံးများ ("${words.join(', ')}") အားလုံး တစ်ပြိုင်နက်တည်း ပါဝင်သော စာမျက်နှာ မတွေ့ပါ။</span>`; return; }
      const inScope = pid => { const m = tp_ftsPageMeta(S, pid); return m && tp_ftsBookMatchesScope(String(m.book_id).trim(), selectedScopes) ? m : null; };
      const phraseSet = new Set(res.phrase);
      const phraseList = res.phrase.map(inScope).filter(Boolean);
      const otherList = words.length > 1 ? res.all.filter(p => !phraseSet.has(p)).map(inScope).filter(Boolean) : [];
      const list = phraseList.concat(otherList);
      if(!list.length){ statusDiv.innerHTML = `<span style='color:red;'>ရွေးချယ်ထားသော အပိုင်းများတွင် မတွေ့ပါ။</span>`; return; }
      const n = x => tp_ftsToBurmeseNumerals(x);
      let msg = `<strong style='color:#8b0000;'>"${words.join(' ')}"</strong> `;
      if(words.length > 1){
        msg += `ဆက်တိုက်ပါဝင်သော စာမျက်နှာ <strong>${n(phraseList.length)}</strong> မျက်နှာ`;
        if(otherList.length) msg += ` (နောက်မှာ စကားလုံးများ ကွဲပြားစွာပါသော ${n(otherList.length)} မျက်နှာ ဆက်ပြထားသည်)`;
      } else msg += `ပါဝင်သော စာမျက်နှာပေါင်း <strong>${n(list.length)}</strong> မျက်နှာ တွေ့ရှိရပါသည်။`;
      statusDiv.innerHTML = msg;
      tp_ftsRenderResultsPage(list, words, resultsDiv, statusDiv, 0);
    }catch(err){
      statusDiv.innerHTML = `<span style='color:red;'>ရှာဖွေရာတွင် အမှားတစ်ခု ဖြစ်ပေါ်ခဲ့ပါသည်: ${(err && err.message) ? err.message : err}</span>`;
    }
  }
  async function tp_ftsSuggestStatic(inputText, ui, S){
    try{
      const trailing = /\s$/.test(inputText);
      const words = tp_ftsNormWords(inputText);
      if(!words.length){ ui.autocompleteList.innerHTML = ""; return; }
      const add = (phrase) => {
        const div = document.createElement("div"); div.innerText = phrase;
        div.addEventListener("click", () => { ui.input.value = phrase; ui.autocompleteList.innerHTML = ""; tp_ftsSearchPhrase(ui); });
        ui.autocompleteList.appendChild(div);
      };
      if(trailing){
        // ဒီစကားစုနောက်မှာ ဘာစာလုံး ဆက်လာလေ့ရှိလဲ — စကားစုပါတဲ့ စာမျက်နှာအချို့ကို ဖတ်ပြီး ရေတွက်သည်
        const res = await tp_ftsFind(S, words);
        ui.autocompleteList.innerHTML = "";
        if(res.missing !== undefined || !res.phrase.length) return;
        const counts = new Map();
        for(const pid of res.phrase.slice(0, 8)){
          const tk = tp_ftsNormWords(tp_ftsPlainTextFromHtml(await tp_ftsPageContent(pid)));
          for(let i = 0; i + words.length < tk.length; i++){
            let ok = true; for(let j = 0; j < words.length; j++) if(tk[i + j] !== words[j]){ ok = false; break; }
            if(ok){ const nx = tk[i + words.length]; counts.set(nx, (counts.get(nx) || 0) + 1); }
          }
        }
        [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 15).forEach(([w]) => add(words.join(" ") + " " + w));
        return;
      }
      const last = words[words.length - 1], prefixWords = words.slice(0, -1);
      let need = null;                                   // ရှေ့စကားစုအပြီး ချက်ချင်းလာနိုင်တဲ့ (pid → တည်နေရာ) စာရင်း
      if(prefixWords.length){
        const res = await tp_ftsFind(S, prefixWords);
        if(res.missing !== undefined || !res.phrase.length){ ui.autocompleteList.innerHTML = ""; return; }
        need = new Set(); res.ends.forEach((ps, pid) => ps.forEach(p => need.add(pid * 65536 + p + 1)));
      }
      const cands = await tp_ftsPrefix(S, last, need ? 300 : 20);
      ui.autocompleteList.innerHTML = "";
      let shown = 0;
      for(const [w, enc] of cands){
        if(shown >= 20) break;
        if(need){
          let hit = false;
          for(const [pid, ps] of tp_ftsDecode(enc)){ if(ps.some(p => need.has(pid * 65536 + p))){ hit = true; break; } }
          if(!hit) continue;
        }
        add(prefixWords.length ? prefixWords.join(" ") + " " + w : w); shown++;
      }
    }catch(e){ /* autocomplete ဆိုတာ non-critical */ }
  }

  async function tp_ftsSearchPhrase(ui){
    { const S = await tp_ftsSInit(); if(S) return tp_ftsSearchStatic(ui, S); }
    const { input, statusDiv, resultsDiv, scopeBoxes } = ui;
    resultsDiv.innerHTML = "";
    const cleanedInput = tp_ftsStripPunctuation(input.value).trim();
    const words = cleanedInput.split(/\s+/).filter(Boolean);

    if(words.length === 0){ statusDiv.innerText = "ကျေးဇူးပြု၍ စကားလုံး သို့မဟုတ် စကားစု ရိုက်ထည့်ပါ။"; return; }

    const selectedScopesUpfront = tp_ftsGetSelectedScopes(scopeBoxes);
    if(selectedScopesUpfront.length === 0){ statusDiv.innerHTML = `<span style='color:red;'>ရှာဖွေရန် အနည်းဆုံး တစ်ခု ရွေးချယ်ပါ။</span>`; return; }

    statusDiv.innerText = "ရှာဖွေနေပါသည်... ခဏစောင့်ပါ။";

    try{
      const db = await tp_ensureFtsDb();
      const { ref, query, orderByChild, equalTo, get } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js");
      await tp_ftsLoadBooksMap(db, ref, get);
      const selectedScopes = tp_ftsGetSelectedScopes(scopeBoxes);

      const wordPromises = words.map(w => get(query(ref(db, "part1"), orderByChild("word"), equalTo(w))));
      const wordSnaps = await Promise.all(wordPromises);
      const pageIdSets = [];

      for(let i = 0; i < words.length; i++){
        const snap = wordSnaps[i];
        if(!snap.exists()){ statusDiv.innerHTML = `<span style='color:red;'>"${words[i]}" ဟူသော စကားလုံး ကျမ်းစာထဲတွင် မရှိပါ။</span>`; return; }
        const matchObj = snap.val();
        const wordData = Object.values(matchObj)[0];
        if(!wordData.rowids || wordData.rowids === 0){ statusDiv.innerHTML = `<span style='color:red;'>"${words[i]}" အတွက် စာမျက်နှာ မတွေ့ပါ။</span>`; return; }
        const ids = String(wordData.rowids).split(",").map(item => item.split("_")[0]).filter(Boolean);
        pageIdSets.push(new Set(ids));
      }

      let commonPageIds = Array.from(pageIdSets[0]);
      for(let i = 1; i < pageIdSets.length; i++) commonPageIds = commonPageIds.filter(id => pageIdSets[i].has(id));

      if(commonPageIds.length === 0){ statusDiv.innerHTML = `<span style='color:red;'>စကားလုံးများ ("${words.join(', ')}") အားလုံး တစ်ပြိုင်နက်တည်း ပါဝင်သော စာမျက်နှာ မတွေ့ရှိပါ။</span>`; return; }

      // Scope (ဝိနည်း/သုတ္တန်/...) ဖြင့် စစ်ထုတ်ရန် book_id ကို သိဖို့ candidate များကို ယူပြီး filter လုပ်မည်
      // Firebase ကို request အများကြီး တစ်ပြိုင်နက်တည်း မပို့ဘဲ (15 ခုစီ) အစုငယ်ခွဲပြီး တစ်ဆင့်ချင်း ယူမည်
      // မှတ်ချက်: commonPageIds ထဲက id များသည် Firebase သိမ်းထားသည့် အစီအစဉ်အတိုင်း (book/basket
      // process လုပ်ခဲ့သည့်အစဉ်နှင့် ဆက်စပ်နိုင်သည်) ဖြစ်နေတတ်သဖြင့်၊ cap ကို နည်းနည်းချင်း (၈၀) ထားလျှင်
      // scope တစ်ခုလုံး (ဥပမာ အဘိဓမ္မာ) လုံးဝ sample ထဲ မပါဘဲ ကျန်ခဲ့နိုင်သည် (ဒီ bug ကြောင့် "အဘိဓမ္မာ"
      // ရလဒ်များ လုံးဝ ပျောက်ဆုံးခဲ့ရခြင်း ဖြစ်သည်)။ ဒါကြောင့် cap ကို တင်ကြိုက် တိုးထားသည်
      const CANDIDATE_CAP = 400;
      const candidateIds = commonPageIds.slice(0, CANDIDATE_CAP);
      const CHUNK_SIZE = 15;
      const allPageInfos = [];
      for(let i = 0; i < candidateIds.length; i += CHUNK_SIZE){
        const chunk = candidateIds.slice(i, i + CHUNK_SIZE);
        const chunkSnaps = await Promise.all(chunk.map(pageId => get(query(ref(db, "part2"), orderByChild("id"), equalTo(Number(pageId))))));
        for(const pageSnap of chunkSnaps){
          if(!pageSnap.exists()) continue;
          allPageInfos.push(Object.values(pageSnap.val())[0]);
        }
      }
      const inScopeInfos = allPageInfos.filter(p => tp_ftsBookMatchesScope(String(p.book_id || "").trim(), selectedScopes));

      // အပိုင်း အားလုံး ရွေးထားလျှင် (filter မလုပ်သည်နှင့်အတူတူ) sample ၈၀ ပေါ်တွင်မူတည်နေခြင်း မရှိစေဘဲ
      // တိကျသော စုစုပေါင်း (commonPageIds.length) ကိုသာ ပြမည်။ အပိုင်း တစ်ခုခု ဖြုတ်ထားမှသာ
      // ဖတ်ရသော candidate များထဲမှ ရွေးချယ်ထားသော အပိုင်းနှင့် ကိုက်ညီသည့်အရေအတွက်ကို ပြသမည်
      const allScopesSelected = selectedScopes.length >= scopeBoxes.length;
      const sampled = commonPageIds.length > candidateIds.length;
      const displayCount = allScopesSelected ? commonPageIds.length : inScopeInfos.length;
      const burmeseCount = tp_ftsToBurmeseNumerals(displayCount);
      if(inScopeInfos.length === 0){
        statusDiv.innerHTML = `<span style='color:red;'>ရွေးချယ်ထားသော အပိုင်းများတွင် မတွေ့ပါ (ကျမ်းစာအားလုံးထဲတွင် စုစုပေါင်း ${tp_ftsToBurmeseNumerals(commonPageIds.length)} မျက်နှာ ရှိပါသည်)။</span>`;
        return;
      }
      const sampleNote = (sampled && !allScopesSelected) ? ` <span style="color:#9a8f7d;font-size:.85em;">(စုစုပေါင်း စာမျက်နှာ ${tp_ftsToBurmeseNumerals(candidateIds.length)} အနက်မှ)</span>` : "";
      statusDiv.innerHTML = `<strong style='color:#8b0000;'>"${words.join(' ')}"</strong> ပါဝင်သော စာမျက်နှာပေါင်း <strong>${burmeseCount}</strong> မျက်နှာ တွေ့ရှိရပါသည်။${sampleNote}`;

      tp_ftsRenderResultsPage(inScopeInfos, words, resultsDiv, statusDiv, 0);
    }catch(err){
      statusDiv.innerHTML = `<span style='color:red;'>ရှာဖွေရာတွင် အမှားတစ်ခု ဖြစ်ပေါ်ခဲ့ပါသည်: ${(err && err.message) ? err.message : err}</span>`;
    }
  }

})();
// Blogspot ရဲ့ iframe ထဲမှာ ဖွင့်ထားရင် မူရင်း Blogspot ကို ပြန်သွားနိုင်တဲ့ ခလုပ်ကို ညာအောက်ထောင့်မှာ ပြမည်
  (function(){
    if(window.top === window.self) return;   // ကိုယ်တိုင် ဖွင့်ထားရင် (iframe မဟုတ်ရင်) မပြပါ
    let blog = "";
    try{ if(location.ancestorOrigins && location.ancestorOrigins.length) blog = location.ancestorOrigins[location.ancestorOrigins.length - 1]; }catch(e){}
    if(!blog && document.referrer){ try{ blog = new URL(document.referrer).origin; }catch(e){} }
    if(!blog) return;
    const link = document.createElement("a");
    link.id = "tp-back-to-blog";
    link.textContent = "🏠 Blog သို့";
    link.href = blog + "/";
    link.target = "_top";
    link.title = "မူရင်း Blogspot သို့ ပြန်သွားရန်";
    link.style.cssText = "position:fixed;right:12px;bottom:12px;z-index:2200;padding:7px 12px;border:1px solid #9fb8a8;border-radius:18px;background:rgba(255,253,247,.94);color:#3a3229;font-size:13px;text-decoration:none;box-shadow:0 1px 6px rgba(0,0,0,.25)";
    document.body.appendChild(link);
  })();

</script>
